openapi: 3.0.1
info:
  title: CrediYa Request API
  description: API para gestión de solicitudes de préstamos
  version: "1.0"
  contact:
    name: CrediYa Team
    email: support@crediyarequest.com
servers:
  - url: http://localhost:8083
    description: Servidor de desarrollo

# Configuración de seguridad
security:
  - BearerAuth: []

paths:
  /api/v1/applications:
    post:
      summary: Crear nueva solicitud de préstamo
      description: |
        Crea una nueva solicitud de préstamo. El tipo de préstamo se determina automáticamente 
        basado en el monto solicitado:
        - PERSONAL: $10,000 - $1,000,000
        - VEHICULAR: $1,000,001 - $5,000,000  
        - HIPOTECARIO: $10,000,000 - $14,999,999
        
        El estado se asigna automáticamente como "Pendiente de revisión".
        
        **Autenticación requerida**: Token JWT válido en header Authorization y en el body.
        **Roles permitidos**: Cliente (roleId: 22)
      tags:
        - Applications
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequestDto'
            example:
              amount: 500000.00
              term: 12
              document: "878549622"
      responses:
        '200':
          description: Solicitud creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCreateResponseDto'
              example:
                idRequest: 1
                stateId: 1
                loantypeId: 2
                amount: 500000.00
                term: 12
                document: "878549622"
        '400':
          description: Datos de entrada inválidos o monto fuera de rango
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                message: "No se encontró un tipo de préstamo válido para el monto: 15000000"
                code: "BUS001"
                timestamp: "2025-08-28T13:47:40.777-05:00"
        '401':
          description: Token de autorización requerido o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorDto'
              examples:
                missing_token:
                  summary: Token faltante
                  value:
                    error: "Token de autorización requerido"
                    status: 401
                invalid_token:
                  summary: Token inválido
                  value:
                    error: "Token inválido"
                    status: 401
                access_denied:
                  summary: Sin permisos
                  value:
                    error: "Acceso denegado: sin permisos"
                    status: 401
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
              example:
                message: "No se encontró el estado 'Pendiente de revisión'"
                code: "BUS001"
                timestamp: "2025-08-28T13:47:40.777-05:00"

    get:
      summary: Obtener todas las solicitudes de préstamo
      description: |
        Obtiene una lista de todas las solicitudes de préstamo en el sistema.
        
        **Autenticación requerida**: Token JWT válido en header Authorization.
        **Roles permitidos**: Administrador (roleId: 21), Asesor (roleId: 23)
      tags:
        - Applications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de solicitudes obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationResponseDto'
              example:
                - idRequest: 1
                  stateId: 1
                  loantypeId: 2
                  amount: 500000.00
                  term: 12
                  document: "878549622"
                - idRequest: 2
                  stateId: 1
                  loantypeId: 1
                  amount: 250000.00
                  term: 6
                  document: "12345678"
        '401':
          description: Token de autorización requerido o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationErrorDto'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

components:
  # Configuración de seguridad
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT requerido para autenticación. 
        Debe incluir el claim 'role' con uno de los siguientes valores:
        - 21: Administrador
        - 22: Cliente  
        - 23: Asesor
        
        Ejemplo: eyJhbGciOiJIUzUxMiJ9.eyJyb2xlIjoyMiwiaWF0IjoxNzU3MDQzMzcyLCJleHAiOjE5Mjk4NDMzNzJ9...

  schemas:
    ApplicationCreateRequestDto:
      type: object
      required:
        - amount
        - term
        - document
        - token
      properties:
        amount:
          type: number
          format: double
          minimum: 10000
          maximum: 14999999
          description: |
            Monto del préstamo. Determina automáticamente el tipo de préstamo:
            - $10,000 - $1,000,000: PERSONAL
            - $1,000,001 - $5,000,000: VEHICULAR  
            - $10,000,000 - $14,999,999: HIPOTECARIO
          example: 5000000.00
        term:
          type: integer
          minimum: 1
          maximum: 360
          description: Plazo del préstamo en meses
          example: 12
        document:
          type: string
          maxLength: 100
          minLength: 1
          description: Número de documento de identidad
          example: "12345678"
        token:
          type: string
          description: |
            Token JWT que debe coincidir con el token enviado en el header Authorization.
            Debe contener el claim 'role' con el ID del rol del usuario.
          example: "eyJhbGciOiJIUzUxMiJ9.eyJyb2xlIjoyMiwiaWF0IjoxNzU3MDQzMzcyLCJleHAiOjE5Mjk4NDMzNzJ9.nXbn8MIAKySeA8hwDULKYjRfVj6HU1Z9DFk1EXuMXc5ri-e07SYRUx6MgNF5tKEjU9rbEMjpTfugBtrQTSPkbQ"

    ApplicationCreateResponseDto:
      type: object
      properties:
        idRequest:
          type: integer
          format: int64
          description: ID de la solicitud generado automáticamente
          example: 1
        stateId:
          type: integer
          format: int64
          description: ID del estado (siempre 1 = "Pendiente de revisión")
          example: 1
        loantypeId:
          type: integer
          format: int64
          description: |
            ID del tipo de préstamo determinado automáticamente:
            - 1: PERSONAL
            - 2: VEHICULAR
            - 3: HIPOTECARIO
          example: 2
        amount:
          type: number
          format: double
          description: Monto del préstamo
          example: 5000000.00
        term:
          type: integer
          description: Plazo del préstamo en meses
          example: 12
        document:
          type: string
          description: Número de documento de identidad
          example: "12345678"

    ErrorResponseDto:
      type: object
      properties:
        message:
          type: string
          description: "Error message"
          example: "Validation failed"
        code:
          type: string
          description: "Error code"
          example: "VALIDATION_ERROR"
        timestamp:
          type: string
          description: "Timestamp when error occurred"
          example: "2024-01-15T10:30:00Z"
      required:
        - message
        - code
        - timestamp

    AuthenticationErrorDto:
      type: object
      properties:
        error:
          type: string
          description: "Mensaje de error de autenticación"
          example: "Token de autorización requerido"
        status:
          type: integer
          description: "Código de estado HTTP"
          example: 401
      required:
        - error
        - status

    ApplicationResponseDto:
      type: object
      properties:
        idRequest:
          type: integer
          format: int64
          description: ID único de la solicitud
          example: 1
        stateId:
          type: integer
          format: int64
          description: ID del estado de la solicitud
          example: 1
        loantypeId:
          type: integer
          format: int64
          description: ID del tipo de préstamo
          example: 2
        amount:
          type: number
          format: double
          description: Monto del préstamo
          example: 500000.00
        term:
          type: integer
          description: Plazo del préstamo en meses
          example: 12
        document:
          type: string
          description: Número de documento de identidad
          example: "878549622"
      required:
        - idRequest
        - stateId
        - loantypeId
        - amount
        - term
        - document

tags:
  - name: Applications
    description: Operaciones relacionadas con solicitudes de préstamo